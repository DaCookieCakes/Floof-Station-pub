name: Daily Upstream Sync

on:
  schedule:
    - cron: "17 2 * * *"  # every day at 02:17 UTC (03:17 CET), off the hour to dodge GitHub queue delays
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Configure git
        run: |
          git fetch origin upstream --depth=100
          git branch upstream origin/upstream

      - name: Configure git
        run: |
          git config user.name "Floof-Station-Bot"
          git config user.email "pachat.kas+bot@gmail.com"

      - name: Check for new upstream commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/master...upstream" --jq .ahead_by)
          echo "Upstream is $AHEAD commit(s) ahead of master"
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

      - name: Create sync branch
        if: steps.check.outputs.ahead != '0'
        run: |
          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH origin/upstream

      - name: Push sync branch
        if: steps.check.outputs.ahead != '0'
        run: |
          git push origin $BRANCH --force

      - name: Create Pull Request
        if: steps.check.outputs.ahead != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Daily Upstream Sync (${{ env.BRANCH }})",
              head:  "${{ env.BRANCH }}",
              base: "master",
              body: "Automated merge of upstream changes into master."
            });

      - name: Delete merged sync branches
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const branches = (await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }))
              .map(b => b.name)
              .filter(n => n.startsWith("sync/upstream-"));

            for (const branch of branches) {
              const open = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${branch}` });
              if (open.data.length > 0) {
                core.info(`Keeping ${branch}: open PR #${open.data[0].number}`);
                continue;
              }

              const cmp = await github.rest.repos.compareCommits({ owner, repo, base: "master", head: branch });
              if (cmp.data.ahead_by > 0) {
                core.info(`Keeping ${branch}: ${cmp.data.ahead_by} commit(s) not in master`);
                continue;
              }

              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              core.info(`Deleted ${branch}`);
            }

# All the Harpy customization

# Ears Markings
- type: marking
  id: HarpyWingDefaultHuescale
  bodyPart: RArm
  groupWhitelist: [ MarkingsGroupHarpy ]
  coloring:
    default:
      type:
        !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SimpleColoring
        color: "#964b00"
  sprites:
  - sprite: _EE/Mobs/Customization/Harpy/harpy_wings.rsi
    state: huescale_harpy


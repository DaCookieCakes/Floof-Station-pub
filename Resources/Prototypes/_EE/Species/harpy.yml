## Updated to modern SS14 by DaCookieCakes

- type: species
  id: Harpy
  name: species-name-harpy
  roundStart: true
  prototype: MobHarpy
  defaultSkinTone: "#C0967F"
  dollPrototype: AppearanceHarpy
  skinColoration: HumanToned
  defaultSoundsBySex:
  - UnisexHarpy
  - UnisexHarpy
  - UnisexHarpy
  voices:
  - UnisexHarpy

- type: entity
  id: ActionHarpyPlayMidi
  name: Play MIDI
  description: Sing your heart out! Right click yourself to set an instrument.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    checkCanInteract: false
    icon: DeltaV/Interface/Actions/harpy_sing.png
    event: !type:OpenUiActionEvent
      key: enum.InstrumentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false

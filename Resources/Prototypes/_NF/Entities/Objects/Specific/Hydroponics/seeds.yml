- type: entity
  parent: SeedBase
  name: jar of bees
  description: Starter kit for a new apiarist.
  id: BeeSeeds
  components:
    - type: Seed
      plantId: bees
    - type: StaticPrice
      price: 50
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/bees.rsi
    - type: Damageable
      damageModifierSet: Glass
    - type: Injurable
      damageContainer: Inorganic
    # "it's a jar of bees, it should break into bees"
    #PORT: yes but I dont want to bring a new mob in yet
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 3
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: GlassBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                MobAngryBeeTimed:
                  min: 1
                  max: 1
              transferForensics: true
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: DamageOnLand
      ignoreResistances: true
      damage:
        types:
          Blunt: 3
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 3
- type: entity
  parent: BasePlant
  id: spesos
  name: spesos
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _NF/Objects/Specific/Hydroponics/spesostree.rsi
    - type: PlantData
      name: seeds-spesos-name
      packetPrototype: SpesosTreeSeeds
      productPrototypes: [ SpaceCash ]
    - type: PlantHarvest
      harvestRepeat: Repeat
    - type: Plant
      lifespan: 45
      maturation: 15
      production: 8
      yield: 3
      potency: 10
      growthStages: 2
    - type: PlantAtmospheric
      lowHeatTolerance: 288 # 15°C
      highHeatTolerance: 308 # 35°C
      

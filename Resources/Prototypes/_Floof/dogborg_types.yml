# Dogborg types. Only selectable by chassis with `allowedCategory: dogborg`.
# Functional setup is copied from the normal borgs in Resources/Prototypes/borg_types.yml via the abstract bases.
# Types with `variantOf` are recolors, shown in the variant row of their main type instead of the main list.
#
# Sprite states are named after spriteBodyState, e.g. for k9:
#   k9, k9_walk, k9_e, k9_e_r, k9_walk_e, k9_l, k9_walk_l, k9-sit, k9-rest, k9-bellyup

- type: borgType
  id: dogborgBase
  abstract: true
  dummyPrototype: DogBorgChassisSelectable
  typeCategory: dogborg
  spriteRsi: _Floof/Mobs/Silicon/dogborg-chassis.rsi
  inventoryTemplateId: borgShort
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg

# Generic
- type: borgType
  id: dogborgBaseGeneric
  parent: dogborgBase
  abstract: true
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleScience
  defaultModules:
  - BorgModulePrying
  - BorgModuleTool
  - BorgModuleInflatable
  - BorgModuleArtifact
  - BorgModuleAnomaly
  radioChannels:
  - Science

# Engineering
- type: borgType
  id: dogborgBaseEngineering
  parent: dogborgBase
  abstract: true
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleEngineering
  defaultModules:
  - BorgModulePrying
  - BorgModuleTool
  - BorgModuleConstruction
  - BorgModuleRCD
  - BorgModuleCable
  radioChannels:
  - Engineering
  - Science
  petSuccessString: petting-success-engineer-cyborg
  petFailureString: petting-failure-engineer-cyborg


# Security (no normal-borg equivalent). Non-lethal only, with its own lawset.
- type: borgType
  id: dogborgBaseSecurity
  parent: dogborgBase
  abstract: true
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity
  defaultModules:
  - BorgModulePrying
  - BorgModuleSecurity
  radioChannels:
  - Security
  - Science
  addComponents:
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: BorgTypeLaws
    laws: K9Protocol


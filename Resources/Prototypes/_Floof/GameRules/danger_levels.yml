- type: entity
  parent: Traitor
  id: FloofTraitor
  components:
  - type: GameRule
    minPlayers: 0
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection # zero slots, ScalingAntagRule picks them
    lateJoinAdditional: false
    antags:
    - !type:LinearAntagCount
      proto: Traitor
      range:
        min: 0
        max: 0
  - type: ScalingAntagRule
    antag: Traitor
    playerRatio: 10
    max: 8

- type: entity
  parent: Thief
  id: FloofThief
  components:
  - type: GameRule
    minPlayers: 0
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection # zero slots, ScalingAntagRule picks them
    lateJoinAdditional: false
    antags:
    - !type:LinearAntagCount
      proto: Thief
      range:
        min: 0
        max: 0
  - type: ScalingAntagRule
    antag: Thief
    playerRatio: 20
    max: 3

- type: entity
  parent: Nukeops
  id: FloofSubNukeops
  components:
  - type: GameRule # keeps upstream minPlayers, nukies need a crew to fight
    cancelPresetOnTooFewPlayers: false

- type: entity
  parent: Revolutionary
  id: FloofSubRevolutionary
  components:
  - type: GameRule # keeps upstream minPlayers, conversion needs a crew
    cancelPresetOnTooFewPlayers: false

- type: entity
  parent: BaseGameRule
  id: FloofYellowSubGamemodes
  components:
  - type: SubGamemodes
    rules:
    - id: FloofThief
      prob: 0.5
    - id: Changeling
      prob: 0.25

- type: entity
  parent: BaseGameRule
  id: FloofRedMajorThreat # picks exactly one
  components:
  - type: SubGamemodes
    rules:
    - id: FloofSubNukeops
      prob: 40
      orGroup: MajorThreat
    - id: SubWizard
      prob: 35
      orGroup: MajorThreat
    - id: FloofSubRevolutionary
      prob: 25
      orGroup: MajorThreat

# Station event schedulers

- type: entity
  parent: BaseGameRule
  id: FloofGreenStationEventScheduler
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: FloofGreenEventsTable

- type: entity
  parent: BaseGameRule
  id: FloofYellowStationEventScheduler
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: FloofYellowEventsTable

- type: entity
  parent: BaseGameRule
  id: FloofRedStationEventScheduler
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: FloofRedEventsTable

# Meteor schedulers - green uses MeteorSwarmMildScheduler, red uses MeteorSwarmScheduler

- type: entity
  parent: BaseGameRule
  id: FloofYellowMeteorSwarmScheduler
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 600 # 10 min
    minMaxEventTiming:
      min: 750 # 12.5 min
      max: 930 # 17.5 min
    scheduledGameRules: !type:NestedSelector
      tableId: FloofYellowMeteorSwarmEventsTable

# Space traffic schedulers - same timing as SpaceTrafficControlEventScheduler

- type: entity
  parent: BaseGameRule
  id: FloofGreenSpaceTrafficScheduler
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 2700 # 45 mins
    maximumSpanUntilFirstEvent: 900
    minMaxEventTiming:
      min: 1200 # 20 mins
      max: 7200 # 120 mins
    scheduledGameRules: !type:NestedSelector
      prob: 0.05
      tableId: FloofGreenSpaceTrafficTable

- type: entity
  parent: BaseGameRule
  id: FloofYellowSpaceTrafficScheduler
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 2700 # 45 mins
    maximumSpanUntilFirstEvent: 900
    minMaxEventTiming:
      min: 1200 # 20 mins
      max: 7200 # 120 mins
    scheduledGameRules: !type:NestedSelector
      prob: 0.05
      tableId: FloofYellowSpaceTrafficTable

- type: entity
  parent: BaseGameRule
  id: FloofRedSpaceTrafficScheduler
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 2700 # 45 mins
    maximumSpanUntilFirstEvent: 900
    minMaxEventTiming:
      min: 1200 # 20 mins
      max: 7200 # 120 mins
    scheduledGameRules: !type:NestedSelector
      prob: 0.05
      tableId: FloofRedSpaceTrafficTable

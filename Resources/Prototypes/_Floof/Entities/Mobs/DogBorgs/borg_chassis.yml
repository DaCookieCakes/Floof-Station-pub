- type: entity
  id: DogBorgChassisSelectable
  parent: BaseDogBorgChassisNT
  name: dogborg
  components:
  - type: Sprite
    sprite: _Floof/Mobs/Silicon/chassis.rsi
    layers:
    - state: robot
      map: [ "enum.BorgVisualLayers.Body", "movement" ]
    - state: robot_e_r
      map: [ "enum.BorgVisualLayers.Light", "movement_e" ]
      shader: unshaded
      visible: false
    - state: robot_l
      shader: unshaded
      map: [ "light", "enum.BorgVisualLayers.LightStatus", "movement_l" ]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: robot_moving
      movement_e:
        state: robot_moving_e
      movement_l:
        state: robot_moving_l
    noMovementLayers:
      movement:
        state: robot
      movement_e:
        state: robot_e
      movement_l:
        state: robot_l
  - type: BorgChassis
    maxModules: 0
    hasMindState: robot_e
    noMindState: robot_e_r
  - type: BorgTransponder
    sprite:
      sprite: _Floof/Mobs/Silicon/chassis.rsi
      state: robot
    name: dogborg
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
  - type: DogBorgSwitchableType
    inherentRadioChannels:
    - Common
    - Binary


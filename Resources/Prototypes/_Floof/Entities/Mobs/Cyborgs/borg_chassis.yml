- type: entity
  parent: BaseBorgChassisNT
  id: DogBorgChassisSelectable
  name: dogborg
  components:
  - type: Sprite
    sprite: _Floof/Mobs/Silicon/dogborg-chassis.rsi
    layers:
    - state: k50
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: k50_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: k50_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    # Default borg can take no modules until selected type.
    maxModules: 0
    hasMindState: k50_e
    noMindState: k50_e_r
  - type: BorgTransponder
    sprite:
      sprite: _Floof/Mobs/Silicon/dogborg-chassis.rsi
      state: k50
    name: cyborg
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Common
    - Binary
    allowedCategory: dogborg
  - type: Dogborg
  - type: LeashAnchor
    kind: Intrinsic

- type: entity
  parent: DogBorgChassisSelectable
  id: DogBorgChassisK50
  name: k50 dogborg
  suffix: type picked
  components:
  - type: BorgSwitchableType
    selectedBorgType: k50


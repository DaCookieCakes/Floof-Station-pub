    sprite: _Floof/Objects/Consumable/Food/snacks.rsi
    state: roasted-crickets-trash
  - type: Item
    inhandVisuals:
      left:
      - state: trash-inhand-left
        color: "#A84438"
      right:
      - state: trash-inhand-right
        color: "#A84438"

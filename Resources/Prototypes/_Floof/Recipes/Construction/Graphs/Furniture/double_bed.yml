- type: constructionGraph
  id: DoubleBed
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: doublebed
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 4
              doAfter: 1
            - material: Cloth
              amount: 4
              doAfter: 1
    - node: doublebed
      entity: DoubleBed
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 4
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 1

- type: entity
  parent:
    - OrganBase
    - OrganBaseChildInternal
  id: OrganDick
  name: dick
  components:
    - type: Organ
      category: Dick
    - type: Sprite
      sprite: _Floof/Mobs/Species/Generic/penis.rsi
      layers:
        - state: penis
    - type: ProducerGenital
      solutionId: balls
    - type: BodyFluidProducer
      solutionName: balls
      reagentId: Cum
      minHungerThreshold: Peckish
    - type: VisualOrganMarkings
      markingData:
        group: Genital
        layers: 
          - Penis
      hideableLayers:
        - enum.HumanoidVisualLayers.Penis
    - type: VisualOrgan
      layer: enum.HumanoidVisualLayers.Penis
      data:
        sprite: _Floof/Mobs/Customization/Genital/cocks.rsi
#        state: penis_nondescript_1_0_FRONT
    - type: Solution
      id: balls
      solution:
        maxVol: 240 # yes, totally normal
        canReact: false
        reagents:
          - ReagentId: Cum
            Quantity: 240


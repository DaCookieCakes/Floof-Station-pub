- type: entity
  parent: BaseCostumeBundle
  id: CostumeBundleBunnySuit
  name: black bunny suit bundle
  components:
  - type: Sprite
    layers:
    - state: outfit-1
      map: [ "enum.StorageFillLayers.Fill" ]
      color: "#2e2e2e"
    - state: wrapper-fill
      color: "#ffffff22"
    - state: wrapper
    - state: label
      color: "#454545"
  - type: SpawnItemsOnUse # Floof - Unwrap bundles
    items:
    - id: ClothingUniformCostumeBunnySuit
    - id: ClothingHeadBunnySuitHeadband
    - id: ClothingNeckBunnySuitCollar
    - id: ClothingHandsBunnySuitCuffs
    - id: ClothingShoesBootsLaceup


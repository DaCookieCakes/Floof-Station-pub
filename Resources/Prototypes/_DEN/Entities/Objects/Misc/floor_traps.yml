# Random Mine Spawners

- type: entity
  parent: MarkerBase
  id: LandMineRandomSpawner
  name: random land mine spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Objects/Misc/landmine.rsi
      state: landmine
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomMineTable
      prob: 1

- type: entityTable
  id: RandomMineTable
  table: !type:GroupSelector
    children:
    - id: LandMineExplosive
      weight: 1
    - id: LandMineEMP
      weight: 1
    - id: LandMineBump
      weight: 1
    - id: LandMineFlash
      weight: 1
    - id: LandMineSmoke
      weight: 1
    - id: LandMineScram
      weight: 1
    - !type:GroupSelector # Needle Mines
      children:
      - id: LandMineNeedleRazorium
      - id: LandMineNeedleSpaceDrugs
      - id: LandMineNeedleMute
      weight: 1
    - id: LandMineHeal  # Rare because useful
      weight: 0.1
    - id: LandMineObliteration  # Rare because incredibly deadly
      weight: 0.1
      
- type: entity
  parent: LandMineRandomSpawner
  id: LandMineRandomSpawnerUnarmed
  name: random land mine spawner
  suffix: unarmed
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomMineTableUnarmed
      prob: 1

- type: entityTable
  id: RandomMineTableUnarmed
  table: !type:GroupSelector
    children:
    - id: LandMineExplosiveUnarmed
      weight: 1
    - id: LandMineEMPUnarmed
      weight: 1
    - id: LandMineBumpUnarmed
      weight: 1
    - id: LandMineFlashUnarmed
      weight: 1
    - id: LandMineSmokeUnarmed
      weight: 1
    - id: LandMineScramUnarmed
      weight: 1
    - !type:GroupSelector # Needle Mines
      children:
      - id: LandMineNeedleRazoriumUnarmed
      - id: LandMineNeedleSpaceDrugsUnarmed
      - id: LandMineNeedleMuteUnarmed
      weight: 1
    - id: LandMineHealUnarmed  # Rare because useful
      weight: 0.1
    - id: LandMineObliterationUnarmed  # Rare because incredibly deadly
      weight: 0.1
      

# Floor Button (can be continuously activated)

- type: entity
  id: FloorTrapButtonUnarmed
  name: floor button
  description: Marked with a highly-visible symbol for easy identification. Who knows what pressing it will do?
  components:
  - type: Clickable
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/click.ogg
      params:
        maxDistance: 1
  - type: InteractionOutline
  - type: Pullable
  - type: MovedByPressure
  - type: Anchorable
  - type: Physics
    bodyType: Static
    fixedRotation: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
          - LowImpassable
  - type: Sprite
    drawdepth: Items
    sprite: _DEN/Objects/Misc/floortrap.rsi
    layers:
    - state: pressure-plate
    - state: pressure-plate-unshaded
      shader: unshaded
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {visible: true}
          False: {visible: false}
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.3
    stepOn: true
  - type: SignalOnTrigger
    keysIn:
    - trigger
    port: Trigger
  - type: DeviceLinkSource
    ports:
      - Trigger
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: LandMine              # Replace this with something more generic, when possible
    sound:
        path: /Audio/Effects/beep_landmine.ogg
        params:
            maxDistance: 3
  - type: Armable
  - type: Construction
    graph: FloorButtonGraph
    node: floorbutton

- type: entity
  id: FloorTrapButton
  suffix: armed
  parent: FloorTrapButtonUnarmed
  components:
  - type: ItemToggle
    activated: true
    onActivate: false
  - type: Armable

# Tripwire Mine (trips, deletes after trigger)

- type: entity
  id: FloorTrapTripwire
  name: tripwire
  description: You've got keen eyes to notice this. The furthest tie is connected to a crude signal transmitter.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    fixedRotation: false
  - type: Fixtures
    fixtures:
      slip:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.1,0.4,0.1"
        hard: false
        layer:
          - LowImpassable
  - type: Sprite
    drawdepth: Items
    sprite: _DEN/Objects/Misc/floortrap.rsi
    layers:
    - state: tripwire
  - type: Appearance
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.3
    stepOn: true
  - type: TriggerOnStepTrigger  # Might be useless?
  - type: SignalOnTrigger
    port: Trigger
  - type: DeviceLinkSource
    ports:
      - Trigger
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: TimerTrigger          # Couldn't find a better way to delay deleting until the signal is sent
    examinable: false
    delay: 1
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: Slippery
  - type: Construction
    graph: TripwireGraph
    node: tripwire
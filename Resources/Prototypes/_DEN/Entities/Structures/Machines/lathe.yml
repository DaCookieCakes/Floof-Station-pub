- type: entity
  parent: BaseLathe
  id: Autotailor
  name: autotailor
  description: Produces fashion-worthy apparel at the press of a button - now with less contraband!
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _DEN/Structures/Machines/autotailor.rsi
    snapCardinals: false
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: AutotailorMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/uniformprinter.ogg
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - DenAutotailorStatic
  # TODO: Uncomment when emagged recipes are added
  # - type: EmagLatheRecipes
  #   emagStaticPacks:
  #   - DenAutotailorEmagStatic
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
